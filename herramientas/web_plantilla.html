<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taller de agentes de IA</title>
<meta name="description" content="Taller «Más allá de ChatGPT: crea y conecta agentes de IA» · Semana de la IA 2026 · UPNA. 38 ejercicios con agentes reales, por perfiles.">
<link rel="icon" href="img/logo_semana_ia_2026_oscuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="vendor/marked.min.js"></script>
<script src="vendor/mermaid.min.js"></script>
<style>
:root{
  --fondo:#F6F5F1; --superficie:#FFFFFF; --superficie2:#F0EEE8; --tinta:#14212B; --tinta2:#4A5866; --linea:#E2DED4;
  --primario:#1E3442; --sobre-primario:#FFFFFF; --oro:#B8862B; --oro-suave:#F6EBD3; --cian:#2B8FBF; --cian-suave:#E2F2FA;
  --verde:#2E8B57; --verde-suave:#E3F3EA; --rojo:#C0453A; --rojo-suave:#FBE6E3; --morado:#7A5BC2; --morado-suave:#EEE8FA; --ambar:#C98A1A;
  --noche:#0F1C26; --noche2:#172833; --nieve:#EEF2F5; --oro-vivo:#E4B858; --cian-vivo:#5BC8EE;
  --sombra1:0 1px 2px rgba(20,33,43,.05),0 2px 6px rgba(20,33,43,.06);
  --sombra3:0 10px 30px rgba(20,33,43,.12),0 2px 8px rgba(20,33,43,.06);
  --radio:18px; --logo:url(img/logo_semana_ia_2026_horizontal_oscuro.png);
}
@media (prefers-color-scheme:dark){:root:not([data-tema="claro"]){
  --fondo:#0B151D; --superficie:#13222D; --superficie2:#1B2F3C; --tinta:#EEF2F5; --tinta2:#A9B8C4; --linea:#25394A;
  --primario:#E4B858; --sobre-primario:#14212B; --oro:#E4B858; --oro-suave:#3A3322; --cian:#5BC8EE; --cian-suave:#173847;
  --verde:#5CC98A; --verde-suave:#173A2A; --rojo:#F08070; --rojo-suave:#3D2220; --morado:#B48CF0; --morado-suave:#2A2340;
  --sombra1:0 1px 2px rgba(0,0,0,.4); --sombra3:0 10px 30px rgba(0,0,0,.5); --logo:url(img/logo_semana_ia_2026_horizontal.png);
}}
:root[data-tema="oscuro"]{
  --fondo:#0B151D; --superficie:#13222D; --superficie2:#1B2F3C; --tinta:#EEF2F5; --tinta2:#A9B8C4; --linea:#25394A;
  --primario:#E4B858; --sobre-primario:#14212B; --oro:#E4B858; --oro-suave:#3A3322; --cian:#5BC8EE; --cian-suave:#173847;
  --verde:#5CC98A; --verde-suave:#173A2A; --rojo:#F08070; --rojo-suave:#3D2220; --morado:#B48CF0; --morado-suave:#2A2340;
  --sombra1:0 1px 2px rgba(0,0,0,.4); --sombra3:0 10px 30px rgba(0,0,0,.5); --logo:url(img/logo_semana_ia_2026_horizontal.png);
}
*{box-sizing:border-box}
html{scroll-padding-top:84px}
body{margin:0;background:var(--fondo);color:var(--tinta);font:16px/1.65 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--cian);text-underline-offset:3px}
h1,h2,h3,.cond{font-family:"Barlow Condensed",system-ui,sans-serif;font-weight:700;line-height:1.1;letter-spacing:.2px}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em;background:var(--superficie2);padding:1px 6px;border-radius:6px}
img{max-width:100%}

/* ---------- barra superior ---------- */
.barra{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--superficie) 88%,transparent);backdrop-filter:blur(12px) saturate(1.4);
  border-bottom:1px solid var(--linea);display:flex;align-items:center;gap:16px;padding:10px max(20px,calc((100% - 1200px)/2))}
.marca{flex:none;display:block;width:150px;height:22px;background:var(--logo) left center/contain no-repeat}
.barra nav{margin-left:auto;display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
.barra nav::-webkit-scrollbar{display:none}
.barra nav a,.icono-btn{flex:none;font:600 15px Barlow;color:var(--tinta2);text-decoration:none;padding:8px 14px;border-radius:999px;border:0;background:none;cursor:pointer;white-space:nowrap}
.barra nav a:hover,.icono-btn:hover{background:var(--superficie2);color:var(--tinta)}
.barra nav a.activo{background:var(--primario);color:var(--sobre-primario)}

main{max-width:1200px;margin:0 auto;padding:36px 20px 96px}
main.ancho{max-width:none;padding:0 0 96px}
.contenedor{max-width:1200px;margin:0 auto;padding:0 20px}
.eyebrow{font:700 12.5px Barlow;letter-spacing:2.2px;text-transform:uppercase;color:var(--oro)}

/* ---------- portada ---------- */
.hero{position:relative;overflow:hidden;background:var(--noche);color:var(--nieve);isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;
  background:radial-gradient(60% 80% at 85% 30%,rgba(91,200,238,.22),transparent 60%),radial-gradient(50% 60% at 10% 100%,rgba(228,184,88,.16),transparent 60%)}
.hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:120px;z-index:-1;background:url(img/circuito_suelo.png) center bottom/cover no-repeat;opacity:.35}
.hero-in{max-width:1200px;margin:0 auto;padding:64px 20px 84px;display:grid;grid-template-columns:1.15fr 1fr;gap:48px;align-items:center}
.hero .eyebrow{color:var(--oro-vivo)}
.hero h1{font-size:clamp(42px,6.2vw,76px);margin:14px 0 18px;font-weight:800;line-height:1.02}
.hero h1 span{color:var(--oro-vivo)}
.hero p.lead{color:#C9D6E0;font-size:19px;margin:0 0 26px;max-width:560px}
.hero figure{margin:0;position:relative}
.hero figure img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(255,255,255,.06)}
.hero figure::before{content:"";position:absolute;inset:-18px;border-radius:36px;background:linear-gradient(135deg,rgba(91,200,238,.35),rgba(228,184,88,.25));filter:blur(28px);z-index:-1}
.hero figcaption{font-size:12px;color:#8FA3B3;margin-top:10px}
.cifras{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.cifra{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:10px 16px}
.cifra b{display:block;font:800 26px "Barlow Condensed";color:var(--oro-vivo);line-height:1}
.cifra span{font-size:13px;color:#B5C4D0}
.hero .btn.lleno{background:var(--oro-vivo);color:#14212B}
.hero .btn.tonal{background:rgba(255,255,255,.1);color:var(--nieve)}
.hero .btn.borde{color:var(--nieve);border-color:rgba(255,255,255,.25)}

.atajos{max-width:1200px;margin:-44px auto 0;padding:0 20px;display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative;z-index:2}
.atajo{display:flex;gap:14px;align-items:flex-start;background:var(--superficie);border-radius:var(--radio);padding:18px;box-shadow:var(--sombra3);text-decoration:none;color:inherit;border:1px solid var(--linea);transition:transform .2s,border-color .2s}
.atajo:hover{transform:translateY(-3px);border-color:var(--oro)}
.atajo .ico{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.atajo b{display:block;font:700 19px "Barlow Condensed";margin-bottom:2px}
.atajo span{font-size:14px;color:var(--tinta2);line-height:1.45}

section.bloque{max-width:1200px;margin:0 auto;padding:72px 20px 0}
h2.sec{font-size:clamp(30px,3.6vw,42px);margin:6px 0 8px}
p.sub{color:var(--tinta2);margin:0 0 26px;font-size:17px;max-width:720px}

.pasos{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:p;position:relative}
.paso{background:var(--superficie);border-radius:var(--radio);box-shadow:var(--sombra1);overflow:hidden;display:flex;flex-direction:column;border:1px solid var(--linea)}
.paso .cap{aspect-ratio:16/10;background:var(--noche) left top/cover no-repeat;border-bottom:1px solid var(--linea)}
.paso .txt{padding:16px 18px 18px}
.paso .txt::before{counter-increment:p;content:counter(p);display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--primario);color:var(--sobre-primario);font:700 16px "Barlow Condensed";margin-bottom:8px}
.paso h3{font-size:22px;margin:0 0 4px}
.paso p{margin:0;color:var(--tinta2);font-size:15px}
.leyenda{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.pill{display:inline-flex;gap:8px;align-items:center;background:var(--superficie);border:1px solid var(--linea);border-radius:999px;padding:8px 14px;font-size:14.5px;color:var(--tinta2)}
.pill b{color:var(--tinta)}

.rejilla{display:grid;gap:16px}
.r2{grid-template-columns:repeat(auto-fill,minmax(300px,1fr))}
.r3{grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.r4{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.tarjeta{background:var(--superficie);border-radius:var(--radio);box-shadow:var(--sombra1);padding:22px;color:inherit;text-decoration:none;display:block;
  transition:box-shadow .2s,transform .2s,border-color .2s;border:1px solid var(--linea)}
a.tarjeta:hover,button.tarjeta:hover{box-shadow:var(--sombra3);transform:translateY(-3px);border-color:var(--oro)}
.tarjeta h3{margin:12px 0 6px;font-size:23px}
.tarjeta p{margin:0;color:var(--tinta2);font-size:15px}
.tarjeta.sel{border-color:var(--oro);box-shadow:0 0 0 2px var(--oro),var(--sombra3)}
button.tarjeta{text-align:left;font:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;width:100%}
.avatar{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--oro-suave)}

.banda{background:var(--noche);color:var(--nieve);border-radius:28px;padding:36px;display:grid;grid-template-columns:1.2fr repeat(3,1fr);gap:24px;align-items:center;position:relative;overflow:hidden}
.banda::after{content:"";position:absolute;right:-40px;bottom:-40px;width:280px;height:280px;background:url(img/circuito_esquina.png) center/contain no-repeat;opacity:.25}
.banda h2{font-size:36px;margin:6px 0 8px}
.banda p{color:#B5C4D0;margin:0;font-size:15px}
.banda .num{font:800 54px "Barlow Condensed";color:var(--oro-vivo);line-height:1}
.banda .eyebrow{color:var(--oro-vivo)}

/* ---------- ejercicios ---------- */
.cab-pagina{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.cab-pagina h1{font-size:clamp(40px,5vw,56px);margin:4px 0 0}
.filtros{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--superficie);border:1px solid var(--linea);border-radius:var(--radio);padding:12px;box-shadow:var(--sombra1);position:sticky;top:64px;z-index:5}
.filtros input{flex:1 1 220px;min-width:0;font:500 15px Barlow;padding:10px 14px;border-radius:12px;border:1px solid var(--linea);background:var(--fondo);color:var(--tinta)}
.filtros input:focus{outline:2px solid var(--oro);border-color:transparent}
.fbtn{font:600 14px Barlow;padding:8px 13px;border-radius:999px;border:1px solid var(--linea);background:var(--fondo);color:var(--tinta2);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.fbtn.on{background:var(--primario);color:var(--sobre-primario);border-color:var(--primario)}
.area{margin-top:40px}
.area-cab{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.area-cab .ico{width:42px;height:42px;border-radius:12px;background:var(--superficie);box-shadow:var(--sombra1);display:grid;place-items:center;font-size:22px}
.area-cab h3{font-size:28px;margin:0}
.area-cab span{color:var(--tinta2);font-size:15px}
.lista{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:12px;margin-top:14px}
.fila{position:relative;display:grid;grid-template-columns:58px 1fr;gap:4px 12px;padding:16px 18px 16px 20px;text-decoration:none;color:inherit;background:var(--superficie);border-radius:16px;
  border:1px solid var(--linea);box-shadow:var(--sombra1);transition:transform .15s,box-shadow .15s,border-color .15s;overflow:hidden}
.fila::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.fila:hover{transform:translateY(-2px);box-shadow:var(--sombra3);border-color:var(--c)}
.fila .n{font:800 20px "Barlow Condensed";color:var(--c);grid-row:span 2;align-self:start;line-height:1.3}
.fila .t{font-weight:700;line-height:1.3}
.fila .m{font-size:13px;color:var(--tinta2);display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:4px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--superficie2);color:var(--tinta2);white-space:nowrap}
.chip.ok{background:var(--verde-suave);color:var(--verde)} .chip.fallo{background:var(--rojo-suave);color:var(--rojo)} .chip.parcial{background:var(--oro-suave);color:var(--ambar)}
.chip.hecho{background:var(--primario);color:var(--sobre-primario)} .chip.demo{background:var(--cian-suave);color:var(--cian)}
.vacio{padding:40px;text-align:center;color:var(--tinta2)}

.btn{display:inline-flex;align-items:center;gap:8px;font:600 15px Barlow;padding:12px 22px;border-radius:999px;border:1px solid transparent;cursor:pointer;text-decoration:none;transition:box-shadow .2s,transform .2s}
.btn:hover{transform:translateY(-1px)}
.btn.lleno{background:var(--primario);color:var(--sobre-primario)}
.btn.lleno:hover{box-shadow:var(--sombra3)}
.btn.tonal{background:var(--oro-suave);color:var(--tinta)}
.btn.borde{background:none;color:var(--tinta);border-color:var(--linea)}
.btn.peq{padding:8px 14px;font-size:14px}
.botones{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}

/* ---------- ficha de ejercicio ---------- */
.ficha{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:28px;align-items:start}
.panel{position:sticky;top:84px;display:grid;gap:14px}
.panel .tarjeta{padding:18px}
.panel h4{margin:0 0 10px;font:700 18px "Barlow Condensed"}
.datos{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;font-size:14.5px}
.datos dt{color:var(--tinta2)} .datos dd{margin:0;font-weight:600}
.orden{display:flex;align-items:center;gap:8px;background:var(--noche);color:#D9E8F2;border-radius:10px;padding:8px 8px 8px 12px;font:13px ui-monospace,Consolas,monospace;margin-bottom:6px}
.orden span{flex:1;overflow-x:auto;white-space:nowrap}
.orden button{flex:none;font:700 11.5px Barlow;padding:4px 10px;border-radius:999px;border:0;background:var(--oro-vivo);color:#14212B;cursor:pointer}

/* ---------- documentos (wiki y enunciados) ---------- */
.doc{background:var(--superficie);border-radius:var(--radio);box-shadow:var(--sombra1);border:1px solid var(--linea);padding:12px 44px 36px;min-width:0}
.doc h1{font-size:clamp(34px,4vw,46px);margin:28px 0 12px}
.doc h2{font-size:28px;margin:44px 0 12px;padding-top:12px;border-top:1px solid var(--linea)}
.doc h3{font-size:22px;margin:30px 0 8px}
.doc h2 a.ancla,.doc h3 a.ancla{opacity:0;margin-left:8px;text-decoration:none;color:var(--tinta2);font-size:.7em}
.doc h2:hover a.ancla,.doc h3:hover a.ancla{opacity:1}
.doc p,.doc li{max-width:78ch}
.doc blockquote{margin:18px 0;padding:14px 18px;border-radius:14px;background:var(--oro-suave);color:var(--tinta);border-left:4px solid var(--oro)}
.doc blockquote p{margin:4px 0}
.doc img{display:block;max-width:100%;height:auto;margin:16px 0 22px;border-radius:14px;border:1px solid var(--linea);box-shadow:var(--sombra3);cursor:zoom-in;background:var(--superficie2)}
.doc table{border-collapse:collapse;width:100%;font-size:14.5px;margin:18px 0;display:block;overflow-x:auto}
.doc th{font:700 16px "Barlow Condensed";text-align:left;color:var(--tinta2);border-bottom:2px solid var(--linea);background:var(--superficie2)}
.doc th,.doc td{padding:9px 12px;border-bottom:1px solid var(--linea);vertical-align:top}
.doc tr:hover td{background:color-mix(in srgb,var(--superficie2) 50%,transparent)}
.doc pre{background:var(--noche);color:#D9E8F2;border-radius:14px;padding:16px 92px 16px 18px;overflow-x:auto;position:relative;font-size:14px}
.doc pre code{background:none;padding:0;color:inherit;white-space:pre-wrap;word-break:break-word}
.doc ul,.doc ol{padding-left:22px}
.doc details{background:var(--superficie2);border-radius:12px;padding:10px 16px;margin:14px 0}
.doc summary{cursor:pointer;font-weight:600}
.copiar{position:absolute;top:10px;right:10px;font:700 12px Barlow;padding:5px 12px;border-radius:999px;border:0;background:var(--oro-vivo);color:#14212B;cursor:pointer}
.mermaid{display:flex;justify-content:center;background:transparent!important;color:var(--tinta)!important}
.progreso{height:8px;border-radius:999px;background:var(--superficie2);overflow:hidden;margin:14px 0 8px}
.progreso div{height:100%;background:linear-gradient(90deg,var(--oro),var(--oro-vivo));border-radius:999px}
.nota{font-size:14px;color:var(--tinta2)}

/* wiki: menú lateral + índice */
.wiki{display:grid;grid-template-columns:240px minmax(0,1fr) 220px;gap:28px;align-items:start}
.wiki-nav,.toc{position:sticky;top:84px;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin}
.wiki-nav .grupo{margin-bottom:18px}
.wiki-nav .grupo b{display:block;font:700 12px Barlow;letter-spacing:1.6px;text-transform:uppercase;color:var(--oro);margin:0 0 6px 10px}
.wiki-nav a{display:block;padding:7px 10px;border-radius:10px;text-decoration:none;color:var(--tinta2);font-size:15px;font-weight:500}
.wiki-nav a:hover{background:var(--superficie2);color:var(--tinta)}
.wiki-nav a.activo{background:var(--primario);color:var(--sobre-primario);font-weight:600}
.wiki-nav select{display:none}
.toc b{display:block;font:700 12px Barlow;letter-spacing:1.6px;text-transform:uppercase;color:var(--tinta2);margin-bottom:8px}
.toc a{display:block;font-size:13.5px;line-height:1.35;padding:5px 0 5px 12px;border-left:2px solid var(--linea);color:var(--tinta2);text-decoration:none}
.toc a:hover,.toc a.activo{color:var(--tinta);border-left-color:var(--oro)}

/* visor de capturas */
.visor{position:fixed;inset:0;z-index:50;background:rgba(6,12,17,.88);display:grid;place-items:center;padding:24px;cursor:zoom-out;backdrop-filter:blur(4px)}
.visor img{max-width:min(1600px,96vw);max-height:88vh;border-radius:12px;box-shadow:0 30px 80px rgba(0,0,0,.6)}
.visor p{color:#D9E8F2;text-align:center;margin:12px 0 0;font-size:14px}

footer{background:var(--noche);color:#B5C4D0;padding:44px 20px 48px;text-align:center;font-size:14px;position:relative;overflow:hidden}
footer::before{content:"";position:absolute;inset:auto 0 0 0;height:90px;background:url(img/circuito_suelo.png) center bottom/cover no-repeat;opacity:.2}
footer img{height:64px;margin:0 10px 14px;vertical-align:middle;background:#fff;border-radius:12px;padding:6px}
footer a{color:var(--oro-vivo)}
footer > *{position:relative}

@media (max-width:1100px){.wiki{grid-template-columns:220px minmax(0,1fr)}.toc{display:none}}
@media (max-width:980px){.pasos{grid-template-columns:repeat(2,1fr)}.atajos{grid-template-columns:repeat(2,1fr)}.banda{grid-template-columns:1fr 1fr}.ficha{grid-template-columns:1fr}.panel{position:static}}
@media (max-width:760px){
  .hero-in{grid-template-columns:1fr;gap:28px;padding:40px 20px 72px}.hero figure{display:none}
  .atajos{grid-template-columns:1fr;margin-top:-36px}.pasos{grid-template-columns:1fr}.banda{grid-template-columns:1fr;padding:26px}
  .doc{padding:6px 18px 24px}.lista{grid-template-columns:1fr}
  .wiki{grid-template-columns:1fr}.wiki-nav{position:static;max-height:none}.wiki-nav .grupo{display:none}.wiki-nav select{display:block;width:100%;font:600 15px Barlow;padding:12px;border-radius:12px;border:1px solid var(--linea);background:var(--superficie);color:var(--tinta)}
  .barra{gap:8px;padding:8px 12px}.marca{width:110px}.barra nav a,.icono-btn{padding:7px 10px;font-size:14px}
  .filtros{top:56px}
}
</style>
</head>
<body>
<header class="barra">
  <a class="marca" href="#/" aria-label="Inicio"></a>
  <nav id="nav">
    <a href="#/" data-r="">Inicio</a>
    <a href="#/ejercicios" data-r="ejercicios">Ejercicios</a>
    <a href="#/progreso" data-r="progreso">Mi progreso</a>
    <a href="#/wiki/Home" data-r="wiki">Wiki</a>
    <a href="taller-agentes-ia.pdf">Diapositivas</a>
    <button class="icono-btn" id="tema" title="Cambiar tema claro/oscuro" aria-label="Cambiar tema">◐</button>
  </nav>
</header>
<main id="app"></main>
<footer>
  <img src="img/logo_catedra_ia.png" alt="Cátedra Tracasa de Ciencias de la Computación e Inteligencia Artificial · UPNA">
  <div>Taller «Más allá de ChatGPT: crea y conecta agentes de IA» · Semana de la IA 2026 · Universidad Pública de Navarra</div>
  <div><a id="repo" href="#">Kit, ejercicios y soluciones en GitHub</a></div>
</footer>
<script>
const D = /*DATOS*/null;
const I = D.indice, EJ = Object.fromEntries(I.ejercicios.map(e => [e.id, e]));
const AREAS = Object.entries(I.puertas);
const NIVCOL = {1:"var(--verde)", 2:"var(--cian)", 3:"var(--morado)", 4:"var(--rojo)"};
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const leer = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d } catch { return d } };
const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)) } catch {} };
const hechos = () => leer("taller_hechos", {});
const perfil = () => leer("taller_perfil", null);
const md = t => window.marked ? marked.parse(t) : `<pre>${esc(t)}</pre>`;
const inline = t => esc(t).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
// Anclas al estilo de GitHub, para que los enlaces #seccion de la wiki funcionen igual que en el repositorio
const slug = t => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");
$("#repo").href = D.repo;

// tema claro/oscuro (se recuerda en este navegador)
const tema0 = leer("taller_tema", null); if (tema0) document.documentElement.dataset.tema = tema0;
$("#tema").onclick = () => {
  const osc = getComputedStyle(document.documentElement).getPropertyValue("--fondo").trim().toLowerCase() === "#0b151d";
  document.documentElement.dataset.tema = osc ? "claro" : "oscuro"; guardar("taller_tema", document.documentElement.dataset.tema); ruta();
};

function fila(e) {
  const v = e.validacion, h = hechos()[e.id];
  const chip = h ? `<span class="chip hecho">✓ Hecho</span>`
    : "";
  return `<a class="fila" style="--c:${NIVCOL[e.nivel]}" href="#/ejercicio/${e.id}"><span class="n">${e.num}</span><span class="t">${esc(e.titulo)}</span>
    <span class="m">${e.demo ? `<span class="chip demo">🎥 Demo</span>` : `<span class="chip">✋ Práctica</span>`}<span>${I.niveles[e.nivel][1]} · ${e.min} min</span>${chip}</span></a>`;
}

function areas(filtro) {
  let h = "";
  for (const [k, a] of AREAS) {
    const ejs = I.ejercicios.filter(e => e.puerta === k && (!filtro || filtro.includes(e.id)));
    if (!ejs.length) continue;
    h += `<section class="area"><div class="area-cab"><span class="ico">${a.icono}</span><h3>${a.nombre}</h3><span>${esc(a.tema)}</span></div>
      <div class="lista">${ejs.map(fila).join("")}</div></section>`;
  }
  return h;
}

function inicio() {
  const p = perfil(), n = I.ejercicios.length - 1;
  let h = `<section class="hero"><div class="hero-in"><div><div class="eyebrow">Semana de la IA 2026 · Viernes 23 de octubre · Aulario UPNA</div>
    <h1>Más allá de ChatGPT: <span>crea y conecta agentes de IA</span></h1>
    <p class="lead">${n} ejercicios con tareas reales —correo, facturas, webs, presentaciones, trámites, programación— para que cada perfil elija su camino. Funciona en cualquier portátil, sin GPU y sin pagar nada.</p>
    <div class="botones"><a class="btn lleno" href="#/wiki/Primeros-pasos">Empezar →</a><a class="btn tonal" href="#/ejercicios">Ver los ejercicios</a><a class="btn borde" href="${D.repo}">GitHub</a></div>
    <div class="cifras"><div class="cifra"><b>${n}</b><span>ejercicios</span></div><div class="cifra"><b>0 €</b><span>con el modelo gratuito</span></div>
      <div class="cifra"><b>5</b><span>áreas</span></div><div class="cifra"><b>4</b><span>perfiles</span></div></div></div>
    <figure><img src="img/encrucijada_semana_ia_2026.jpg" alt="Dos personas ante un camino de circuitos"><figcaption>Imagen del cartel de la Semana de la IA 2026</figcaption></figure></div></section>
    <div class="atajos">
      <a class="atajo" href="#/wiki/Primeros-pasos"><span class="ico" style="background:var(--oro-suave)">🚀</span><span><b>Primeros pasos</b><span>Instala, comprueba el entorno y haz tu primer ejercicio.</span></span></a>
      <a class="atajo" href="#/wiki/Plan-B"><span class="ico" style="background:var(--cian-suave)">☁️</span><span><b>Sin portátil</b><span>Todo en el navegador con GitHub Codespaces, paso a paso.</span></span></a>
      <a class="atajo" href="#/wiki/Demos"><span class="ico" style="background:var(--morado-suave)">🎥</span><span><b>Demos con capturas</b><span>Las demos del profesor, tal como salieron.</span></span></a>
      <a class="atajo" href="#/wiki/Modelos#-si-se-acaba-el-modelo-gratuito"><span class="ico" style="background:var(--verde-suave)">🔁</span><span><b>¿Se acabó lo gratis?</b><span>Cambia de modelo y sigue sin pagar.</span></span></a>
    </div>
    <section class="bloque"><div class="eyebrow">Cómo funciona</div><h2 class="sec">Un encargo, un agente y un comprobador</h2>
    <p class="sub">Cada ejercicio es una tarea real. Tú escribes el encargo, el agente trabaja en una copia y un programa comprueba si lo ha hecho de verdad.</p>
    <div class="pasos">
      <div class="paso"><div class="cap" style="background-image:url(img/wiki/11_empezar.png)"></div><div class="txt"><h3>Prepara la carpeta</h3><p><code>python taller.py empezar ej24</code> te cuenta la situación y te da el encargo.</p></div></div>
      <div class="paso"><div class="cap" style="background-image:url(img/wiki/oc_1_encargo.png)"></div><div class="txt"><h3>Pega el encargo</h3><p><code>python taller.py abrir ej24</code> abre opencode: pega, Enter y míralo trabajar.</p></div></div>
      <div class="paso"><div class="cap" style="background-image:url(img/wiki/oc_2_trabajando.png)"></div><div class="txt"><h3>Mira cómo trabaja</h3><p>Lee, piensa, escribe y ejecuta. Puedes corregirle sobre la marcha.</p></div></div>
      <div class="paso"><div class="cap" style="background-image:url(img/wiki/oc_3_comprobar.png)"></div><div class="txt"><h3>Compruébalo</h3><p>Solo cuenta si lo dice <code>comprobar</code>, nunca si lo dice el agente.</p></div></div>
    </div>
    <div class="leyenda"><span class="pill">🎥 <b>Demo en directo</b>: la hace el profesor en el proyector</span><span class="pill">✋ <b>Práctica</b>: la haces tú, a tu ritmo</span>
      <span class="pill">🟢 Fácil · 🔵 Medio · 🟣 Avanzado · 🔴 Experto</span></div></section>
    <section class="bloque"><div class="eyebrow">Tu camino</div><h2 class="sec">¿Cuál es tu perfil?</h2><p class="sub">Elige uno para ver tu itinerario recomendado. Se guarda en este navegador y puedes salirte cuando quieras.</p><div class="rejilla r4">`;
  for (const [k, v] of Object.entries(I.perfiles))
    h += `<button class="tarjeta ${p === k ? "sel" : ""}" onclick="elegir('${k}')"><div class="avatar">${v.icono}</div><h3>${v.nombre}</h3><p>${esc(v.quien)}</p></button>`;
  h += `</div>`;
  if (p) {
    const v = I.perfiles[p];
    h += `<h2 class="sec" style="margin-top:44px">Tu itinerario · ${v.nombre}</h2><p class="sub">💡 ${inline(v.consejo)}</p>${areas(v.ruta)}
      <div class="botones"><a class="btn tonal" href="#/ejercicios">Ver todos los ejercicios</a></div>`;
  }
  h += `</section>`;
  return h;
}

// filtros de la lista de ejercicios (se conservan mientras navegas)
const F = {q: "", nivel: 0, tipo: ""};
function filtrar() {
  const q = F.q.trim().toLowerCase();
  const ids = I.ejercicios.filter(e => (!q || (e.num + " " + e.titulo + " " + e.escena).toLowerCase().includes(q))
    && (!F.nivel || e.nivel === F.nivel) && (!F.tipo || (F.tipo === "demo") === !!e.demo)).map(e => e.id);
  $("#lista-ej").innerHTML = ids.length ? areas(ids) : `<div class="vacio">Ningún ejercicio coincide. <a href="javascript:void 0" onclick="F.q='';F.nivel=0;F.tipo='';$('#buscar').value='';filtrar()">Quitar filtros</a></div>`;
  document.querySelectorAll("[data-n]").forEach(b => b.classList.toggle("on", +b.dataset.n === F.nivel));
  document.querySelectorAll("[data-t]").forEach(b => b.classList.toggle("on", b.dataset.t === F.tipo));
}
function ejercicios() {
  const niveles = Object.values(I.niveles).map(([ico, n], i) => `<button class="fbtn" data-n="${i + 1}" onclick="F.nivel=F.nivel===${i + 1}?0:${i + 1};filtrar()"><span class="dot" style="background:${NIVCOL[i + 1]}"></span>${n}</button>`).join("");
  setTimeout(filtrar);
  return `<div class="cab-pagina"><div><div class="eyebrow">${I.ejercicios.length - 1} ejercicios · 6 áreas</div><h1>Ejercicios</h1></div>
      <a class="btn borde peq" href="#/progreso">Mi progreso →</a></div>
    <div class="filtros"><input id="buscar" type="search" placeholder="Buscar: correo, pptx, factura, MCP…" value="${esc(F.q)}" oninput="F.q=this.value;filtrar()">
      ${niveles}<button class="fbtn" data-t="demo" onclick="F.tipo=F.tipo==='demo'?'':'demo';filtrar()">🎥 Demos</button>
      <button class="fbtn" data-t="practica" onclick="F.tipo=F.tipo==='practica'?'':'practica';filtrar()">✋ Prácticas</button></div>
    <div id="lista-ej"></div>`;
}

function ejercicio(id) {
  const e = EJ[id];
  if (!e || !D.escenas[id]) return `<p>No encuentro ese ejercicio. <a href="#/ejercicios">Ver todos</a>.</p>`;
  const h = hechos()[id], a = I.puertas[e.puerta], v = e.validacion;
  const orden = t => `<div class="orden"><span>${esc(t)}</span><button onclick="navigator.clipboard.writeText('${t}');this.textContent='✓'">Copiar</button></div>`;
  // Los programas de Python (F.0, F.1, F.9) no se abren con opencode: se ejecutan, y no tienen comprobador
  const PROG = {f0: "react_min.py", f1: "fc_calculadora.py", f9: "medir.py ej07 5"};
  const script = e.modo === "script";
  const ordenes = script ? [`python taller.py empezar ${e.num_corto}`].concat(PROG[e.num_corto] ? [`python taller.py ejecutar ${e.num_corto} ${PROG[e.num_corto]}`] : [])
                         : [`python taller.py empezar ${e.num_corto}`, `python taller.py abrir ${e.num_corto}`];
  return `<div class="botones" style="margin-top:0"><a class="btn borde peq" href="#/ejercicios">← Todos los ejercicios</a></div>
    <div class="ficha"><div class="doc">${md(D.escenas[id])}</div>
    <aside class="panel">
      <div class="tarjeta"><h4>${a.icono} ${a.nombre}</h4><dl class="datos">
        <dt>Dificultad</dt><dd><span class="dot" style="background:${NIVCOL[e.nivel]}"></span> ${I.niveles[e.nivel][1]}</dd>
        <dt>Tiempo</dt><dd>${e.min} min</dd><dt>Tipo</dt><dd>${e.demo ? "🎥 Demo del profesor" : "✋ Práctica"}</dd>
        <dt>Perfiles</dt><dd>${e.perfiles.map(p => I.perfiles[p].icono).join(" ")}</dd>
</dl></div>
      <div class="tarjeta"><h4>Hazlo</h4>${ordenes.map(orden).join("")}${script ? "" : orden(`python taller.py comprobar ${e.num_corto}`)}
        <button class="btn ${h ? "tonal" : "lleno"} peq" style="width:100%;justify-content:center;margin-top:8px" onclick="marcar('${id}')">${h ? "✓ Completado (desmarcar)" : "Marcar como completado"}</button>
        <p class="nota" style="margin:8px 0 0">${script ? "Es un programa que miras tú (sin opencode): márcalo cuando cumpla «¿Lo ha hecho de verdad?»." : "Márcalo cuando <code>comprobar</code> te diga que está bien."}</p></div>
      <div class="tarjeta"><h4>Más</h4><div style="display:grid;gap:8px">
        ${e.demo ? `<a class="btn tonal peq" href="#/wiki/Demos">🎥 Capturas de la demo</a>` : ""}
        <a class="btn borde peq" href="${D.repo}/tree/main/alumnos/ejercicios/${id}">Datos del ejercicio</a>
        <a class="btn borde peq" href="${D.repo}/tree/main/alumnos/soluciones/${id}">Solución real</a></div></div>
    </aside></div>`;
}

function nivel(s) {
  const ids = Object.keys(s).filter(i => EJ[i]);
  const areasHechas = new Set(ids.map(i => EJ[i].puerta));
  const seg = s["ej10_inyeccion_prompt"], experto = ids.some(i => EJ[i].nivel === 4);
  if (seg && ["A", "B", "C", "D", "F"].every(a => areasHechas.has(a)) && experto) return 2;
  if (seg && ids.length >= 7 && [...areasHechas].filter(a => a !== "X").length >= 3) return 1;
  if (seg && ids.length >= 4) return 0;
  return null;
}

function progreso() {
  const s = hechos(), n = Object.keys(s).length, f = nivel(s);
  let h = `<div class="cab-pagina"><div><div class="eyebrow">Se guarda en este navegador</div><h1>Mi progreso</h1></div></div>
    <p class="sub">${n} ejercicio${n === 1 ? "" : "s"} completado${n === 1 ? "" : "s"}. En el portátil: <code>python taller.py progreso</code>.</p><div class="rejilla r3">`;
  for (const [k, a] of AREAS) {
    const ejs = I.ejercicios.filter(e => e.puerta === k), x = ejs.filter(e => s[e.id]).length;
    h += `<div class="tarjeta"><div class="avatar">${a.icono}</div><h3>${a.nombre}</h3><div class="progreso"><div style="width:${100 * x / ejs.length}%"></div></div>
      <p>${x} de ${ejs.length}${x ? " · " + ejs.filter(e => s[e.id]).map(e => e.num).join(", ") : ""}</p></div>`;
  }
  h += `</div><h2 class="sec" style="margin-top:44px">Niveles</h2><div class="rejilla r2">`;
  I.finales.forEach(([ico, nom, como, texto], i) => {
    h += `<div class="tarjeta ${f === i ? "sel" : ""}"><div class="avatar">${ico}</div><h3>${nom}${f === i ? " · tu nivel" : ""}</h3><p><em>${inline(como)}</em></p><p style="margin-top:8px">${inline(texto)}</p></div>`;
  });
  return h + `</div><div class="botones"><button class="btn borde" onclick="if(confirm('¿Borrar tu progreso de este navegador?')){guardar('taller_hechos',{});ruta()}">Borrar mi progreso</button></div>`;
}

const GRUPOS = [["Empezar", ["Home", "Instalar", "Primeros-pasos", "Modo-interactivo", "Plan-B", "Demos"]],
  ["Entender", ["Como-funciona", "Conceptos", "Encargos", "Seguridad", "Glosario"]],
  ["Configurar y arreglar", ["Modelos", "Clave-de-clase", "Variables-de-entorno", "opencode-json", "Problemas", "opencode-2"]]];
const NOMBRES = {Home: "🧭 Inicio", Instalar: "🛠️ Instalar", "Primeros-pasos": "🚀 Primeros pasos", "Clave-de-clase": "🔑 Clave de clase", "Modo-interactivo": "🖥️ Modo interactivo",
  "Plan-B": "🆘 Plan B", Demos: "🎥 Demos del profesor", "Como-funciona": "🧭 Cómo funciona", Conceptos: "🧠 Conceptos", Encargos: "✍️ Encargos",
  Seguridad: "🛡️ Seguridad", Glosario: "📖 Glosario", Modelos: "🤖 Modelos", "Variables-de-entorno": "🔑 Variables de entorno",
  "opencode-json": "⚙️ opencode.json", Problemas: "🔧 Problemas", "opencode-2": "🔄 opencode 2.x"};
function wiki(p) {
  const todas = Object.keys(D.wiki), usadas = GRUPOS.flatMap(g => g[1]);
  const grupos = [...GRUPOS, ["Más", todas.filter(k => !usadas.includes(k))]];
  const nav = grupos.map(([g, ks]) => ks.filter(k => D.wiki[k]).length ? `<div class="grupo"><b>${g}</b>${ks.filter(k => D.wiki[k]).map(k =>
    `<a class="${k === p ? "activo" : ""}" href="#/wiki/${k}">${NOMBRES[k] || k.replace(/-/g, " ")}</a>`).join("")}</div>` : "").join("");
  const sel = `<select onchange="location.hash='#/wiki/'+this.value">${todas.map(k => `<option value="${k}" ${k === p ? "selected" : ""}>${NOMBRES[k] || k}</option>`).join("")}</select>`;
  return `<div class="wiki"><nav class="wiki-nav">${nav}${sel}</nav><div class="doc">${D.wiki[p] ? md(D.wiki[p]) : "<p>Página no encontrada.</p>"}</div><aside class="toc" id="toc"></aside></div>`;
}

function elegir(k) { guardar("taller_perfil", k); ruta(); }
function marcar(id) { const s = hechos(); if (s[id]) delete s[id]; else s[id] = new Date().toISOString(); guardar("taller_hechos", s); ruta(); }

function visor(img) {
  const v = document.createElement("div"); v.className = "visor";
  v.innerHTML = `<div><img src="${img.src}" alt=""><p>${esc(img.alt || "")}</p></div>`;
  v.onclick = () => v.remove(); document.addEventListener("keydown", function k(ev) { if (ev.key === "Escape") { v.remove(); document.removeEventListener("keydown", k); } });
  document.body.appendChild(v);
}

// ---------------------------------------------------------------- valoraciones (el QR del final lleva aquí)
function valorar() {
  const E = D.enlaces || {};
  if (E.valorar) { setTimeout(() => location.href = E.valorar, 1200); return `<div class="doc"><h1>⭐ Valora el taller</h1><p><a class="btn lleno" href="${esc(E.valorar)}">Abrir el formulario →</a></p></div>`; }
  if (!E.ntfy_tema) return `<div class="doc"><h1>⭐ Valora el taller</h1><p>El formulario estará disponible al final del taller.</p></div>`;
  let ya = false; try { ya = !!localStorage.getItem("taller_valorado"); } catch (e) {}
  const op = (n, vs) => `<div class="opciones" data-n="${n}">${vs.map(v => `<button type="button" class="fbtn" onclick="elegirOp(this)">${v}</button>`).join("")}</div>`;
  const area = (n, t) => `<label class="campo"><b>${t}</b><textarea name="${n}" rows="3" maxlength="1500"></textarea></label>`;
  return `<div class="doc valorar" style="max-width:720px;margin:0 auto">
    <style>.valorar .campo{display:block;margin:18px 0}.valorar .campo b{display:block;margin-bottom:6px}
      .valorar textarea{width:100%;box-sizing:border-box;font:inherit;padding:10px;border-radius:12px;border:1px solid var(--borde,#ccc);background:var(--tarjeta,#fff);color:inherit}
      .valorar .opciones{display:flex;flex-wrap:wrap;gap:8px}.valorar .estrellas button{font-size:30px;background:none;border:0;cursor:pointer;color:#c9c2b0;padding:0 2px}
      .valorar .estrellas button.on{color:#e4b858}</style>
    <h1>⭐ ¿Qué te ha parecido el taller?</h1>
    <p>Dos minutos y <b>anónimo</b>: no pedimos nombre ni correo. Solo es obligatoria la nota.</p>
    ${ya ? `<p class="nota">Ya has enviado una valoración desde este navegador. Si quieres, puedes mandar otra.</p>` : ""}
    <form id="fval" onsubmit="event.preventDefault();enviarValoracion()">
      <div class="campo"><b>Nota general</b><div class="estrellas" id="estrellas">${[1,2,3,4,5].map(n => `<button type="button" aria-label="${n} estrellas" onclick="ponerNota(${n})">★</button>`).join("")}</div></div>
      <div class="campo"><b>El ritmo ha sido…</b>${op("ritmo", ["Demasiado lento", "Bien", "Demasiado rápido"])}</div>
      <div class="campo"><b>¿Te va a servir en tu día a día?</b>${op("utilidad", ["Mucho", "Algo", "Poco", "Nada"])}</div>
      <div class="campo"><b>Tu perfil</b>${op("perfil", ["Explorador/a", "Oficina y aula", "Programador/a", "Arquitecto/a"])}</div>
      <div class="campo"><b>¿Lo recomendarías?</b>${op("recomendaria", ["Sí", "Quizá", "No"])}</div>
      ${area("gusto", "Lo que más te ha gustado")}${area("mejorar", "Qué mejorarías")}${area("otros", "Algo más (opcional)")}
      <button class="btn lleno" type="submit">Enviar valoración</button></form>
    <div id="val-res" style="margin-top:16px"></div></div>`;
}
let VAL_NOTA = 0;
function ponerNota(n) { VAL_NOTA = n; document.querySelectorAll("#estrellas button").forEach((b, i) => b.classList.toggle("on", i < n)); }
function elegirOp(b) { b.parentElement.querySelectorAll("button").forEach(x => x.classList.toggle("on", x === b)); }
async function enviarValoracion() {
  const res = $("#val-res");
  if (!VAL_NOTA) { res.innerHTML = `<p style="color:#c0392b">Elige una nota de 1 a 5 estrellas.</p>`; return; }
  const v = {tipo: "valoracion", nota: VAL_NOTA};
  document.querySelectorAll("#fval .opciones").forEach(o => { const b = o.querySelector("button.on"); if (b) v[o.dataset.n] = b.textContent; });
  document.querySelectorAll("#fval textarea").forEach(t => { if (t.value.trim()) v[t.name] = t.value.trim(); });
  try { const p = localStorage.getItem("taller_perfil"); if (p) v.perfil_web = p; } catch (e) {}
  res.innerHTML = "<p>Enviando…</p>";
  try {
    const r = await fetch("https://ntfy.sh/" + D.enlaces.ntfy_tema, {method: "POST", body: JSON.stringify(v)});
    if (!r.ok) throw new Error(r.status);
    try { localStorage.setItem("taller_valorado", "1"); } catch (e) {}
    $("#fval").remove();
    res.innerHTML = `<h2>¡Gracias! 🙌</h2><p>Valoración recibida. Eskerrik asko.</p>`;
  } catch (e) {
    res.innerHTML = `<p style="color:#c0392b">No se ha podido enviar (¿sin conexión?). Espera un momento y pulsa otra vez «Enviar valoración».</p>`;
  }
}

// ---------------------------------------------------------------- clave de clase (cifrada; el PIN se da en clase)
function clave() {
  if (!D.clave) return `<div class="doc"><h1>Clave de clase</h1><p>Ahora mismo no hay clave de clase. Usa el modelo gratuito de opencode
    (<a href="#/wiki/Modelos">🤖 Modelos</a>).</p></div>`;
  return `<div class="doc" style="max-width:720px;margin:0 auto">
    <h1>🔑 Clave de clase</h1>
    <p>Escribe el <b>PIN</b> que ha dado el profesor y pulsa <b>Ver la clave</b>. Se descifra aquí, en tu navegador.</p>
    <form onsubmit="event.preventDefault();abrirClave()" style="display:flex;gap:8px;flex-wrap:wrap;margin:16px 0">
      <input id="pin" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="PIN" inputmode="numeric"
        style="flex:1;min-width:200px;font:inherit;font-size:18px;padding:10px 14px;border-radius:12px;border:1px solid var(--borde,#ccc);background:var(--tarjeta,#fff);color:inherit">
      <button class="btn lleno" type="submit">Ver la clave</button></form>
    <div id="clave-res"></div></div>`;
}
async function abrirClave() {
  const res = $("#clave-res"), pin = $("#pin").value.trim().toLowerCase(), c = D.clave;
  const b = x => Uint8Array.from(atob(x), ch => ch.charCodeAt(0));
  res.innerHTML = "<p>Comprobando el PIN… (tarda un par de segundos)</p>";
  try {
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({name: "PBKDF2", salt: b(c.sal), iterations: c.iter, hash: "SHA-256"}, base,
      {name: "AES-GCM", length: 256}, false, ["decrypt"]);
    const txt = new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: b(c.iv)}, k, b(c.cifrado)));
    const linea = "OPENROUTER_API_KEY=" + txt;
    res.innerHTML = `<p>✅ Esta es la clave de la clase. Copia la línea entera:</p>
      <pre><code>${esc(linea)}</code></pre>
      <h2>Dónde se pega</h2>
      <ol><li>En la carpeta <code>alumnos</code> del kit, crea el fichero <code>.env</code> si no lo tienes:
        <code>copy .env.example .env</code> (Windows) o <code>cp .env.example .env</code> (Linux, Mac, Codespaces).</li>
      <li>Ábrelo (<code>notepad .env</code>, <code>nano .env</code> o el editor de Codespaces) y sustituye la línea
        <code>OPENROUTER_API_KEY=</code> por la que has copiado. Guarda.</li>
      <li>Comprueba: <code>python taller.py entorno</code> tiene que decir <b>openrouter/z-ai/glm-5.3-flash</b>.</li>
      <li>Las carpetas de ejercicios que ya habías empezado siguen con el modelo gratuito: bórralas o usa
        <code>python taller.py abrir ej24 --modelo openrouter/z-ai/glm-5.3-flash</code>.</li></ol>
      <p>🔐 Es una clave compartida y con límite de gasto, solo para el taller: no la publiques, no la subas a git y no la
        uses para otras cosas. Deja de funcionar después del taller.</p>`;
    res.querySelectorAll("pre").forEach(pre => { const bt = document.createElement("button"); bt.className = "copiar"; bt.textContent = "Copiar";
      bt.onclick = () => navigator.clipboard.writeText(linea).then(() => { bt.textContent = "Copiado"; setTimeout(() => bt.textContent = "Copiar", 1500); }); pre.appendChild(bt); });
  } catch (e) {
    res.innerHTML = `<p style="color:#c0392b">❌ Ese PIN no es. Revísalo y prueba otra vez.</p>`;
  }
}

async function ruta() {
  const partes = location.hash.replace(/^#\/?/, "").split("/");
  const a = partes[0], [b, ancla] = (partes[1] || "").split("#");
  const app = $("#app");
  app.innerHTML = (a === "ejercicio" || a === "escena") ? ejercicio(b) : a === "ejercicios" ? ejercicios() : a === "progreso" ? progreso()
    : a === "wiki" ? wiki(decodeURIComponent(b || "Home")) : a === "clave" ? clave() : a === "valorar" ? valorar() : inicio();
  app.classList.toggle("ancho", !a);
  document.querySelectorAll("#nav a").forEach(x => x.classList.toggle("activo", x.dataset.r === ((a === "ejercicio" || a === "escena") ? "ejercicios" : a || "")));
  app.querySelectorAll("pre code.language-mermaid").forEach(c => { const d = document.createElement("pre"); d.className = "mermaid"; d.textContent = c.textContent; c.parentElement.replaceWith(d); });
  if (window.mermaid && app.querySelector(".mermaid")) {
    const osc = getComputedStyle(document.documentElement).getPropertyValue("--fondo").trim().toLowerCase() === "#0b151d";
    mermaid.initialize({startOnLoad: false, theme: osc ? "dark" : "neutral", fontFamily: "Barlow"});
    try { await mermaid.run({nodes: app.querySelectorAll(".mermaid")}); } catch (e) { console.warn(e); }
  }
  app.querySelectorAll(".doc pre:not(.mermaid)").forEach(pre => {
    const btn = document.createElement("button"); btn.className = "copiar"; btn.textContent = "Copiar";
    btn.onclick = () => navigator.clipboard.writeText(pre.querySelector("code")?.innerText ?? pre.innerText).then(() => { btn.textContent = "Copiado"; setTimeout(() => btn.textContent = "Copiar", 1500); });
    pre.appendChild(btn);
  });
  // capturas: carga diferida y visor al hacer clic
  app.querySelectorAll(".doc img").forEach(img => { img.loading = "lazy"; img.decoding = "async"; img.onclick = () => visor(img); });
  // anclas en los títulos e índice «En esta página»
  const base = location.hash.split("#").slice(0, 2).join("#");
  const tit = [...app.querySelectorAll(".doc h2, .doc h3")];
  tit.forEach(t => { t.id = slug(t.textContent); const l = document.createElement("a"); l.className = "ancla"; l.href = base + "#" + t.id; l.textContent = "#"; t.appendChild(l); });
  const toc = $("#toc");
  if (toc) {
    const h2 = tit.filter(t => t.tagName === "H2");
    toc.innerHTML = h2.length > 2 ? `<b>En esta página</b>` + h2.map(t => `<a href="${base}#${t.id}" data-id="${t.id}">${esc(t.textContent.replace(/#$/, ""))}</a>`).join("") : "";
  }
  // enlaces internos de la página (#seccion): desplazarse sin cambiar de página
  app.querySelectorAll('.doc a[href^="#"]:not([href^="#/"])').forEach(l => l.href = base + l.getAttribute("href"));
  if (ancla && document.getElementById(ancla)) document.getElementById(ancla).scrollIntoView(); else window.scrollTo(0, 0);
}
let rutaAnterior = "";
window.addEventListener("hashchange", () => {
  const actual = location.hash.split("#").slice(0, 2).join("#");
  const ancla = location.hash.split("#")[2];
  if (actual === rutaAnterior && ancla && document.getElementById(ancla)) { document.getElementById(ancla).scrollIntoView({behavior: "smooth"}); return; }
  rutaAnterior = actual; ruta();
});
rutaAnterior = location.hash.split("#").slice(0, 2).join("#");
ruta();
// índice: resalta la sección visible
addEventListener("scroll", () => {
  const ts = [...document.querySelectorAll(".doc h2[id]")]; if (!ts.length) return;
  let act = ts[0].id; for (const t of ts) if (t.getBoundingClientRect().top < 120) act = t.id;
  document.querySelectorAll("#toc a").forEach(a => a.classList.toggle("activo", a.dataset.id === act));
}, {passive: true});
</script>
</body>
